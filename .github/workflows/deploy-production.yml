name: Deploy production to Amazon EC2

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            image_tag:
                description: Existing 40-character ECR image tag to roll back to
                required: false
                type: string

permissions:
    contents: read
    id-token: write

concurrency:
    group: better-budget-production
    cancel-in-progress: false

env:
    AWS_REGION: us-east-2
    ECR_REPOSITORY: better-budget/app
    PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-24.04
        timeout-minutes: 60

        steps:
            - name: Select image tag
              id: release
              env:
                  REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
                      image_tag="$REQUESTED_IMAGE_TAG"
                      build_image=false
                  else
                      image_tag="$GITHUB_SHA"
                      build_image=true
                  fi

                  if [[ ! "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "The image tag must be a full lowercase Git commit SHA." >&2
                      exit 1
                  fi

                  echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
                  echo "build_image=$build_image" >> "$GITHUB_OUTPUT"

            - name: Validate production configuration
              run: |
                  if [[ ! "$PRODUCTION_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]; then
                      echo "Set the PRODUCTION_URL repository variable to the CloudFront HTTPS origin." >&2
                      exit 1
                  fi

            - name: Check out repository
              if: steps.release.outputs.build_image == 'true'
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up Node.js
              if: steps.release.outputs.build_image == 'true'
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              if: steps.release.outputs.build_image == 'true'
              run: npm ci

            - name: Verify source
              if: steps.release.outputs.build_image == 'true'
              run: |
                  npm run format:check
                  npm run typecheck
                  npm run lint

            - name: Configure temporary AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: arn:aws:iam::563692880710:role/better-budget-github-deploy
                  role-session-name: better-budget-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Verify immutable ECR repository
              run: |
                  mutability=$(aws ecr describe-repositories \
                      --repository-names "$ECR_REPOSITORY" \
                      --query 'repositories[0].imageTagMutability' \
                      --output text)

                  if [[ "$mutability" != "IMMUTABLE" ]]; then
                      echo "ECR repository $ECR_REPOSITORY must use immutable image tags; found $mutability." >&2
                      exit 1
                  fi

            - name: Inspect release image
              id: release_image
              env:
                  BUILD_IMAGE: ${{ steps.release.outputs.build_image }}
                  IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
              run: |
                  image_digest=$(aws ecr batch-get-image \
                      --repository-name "$ECR_REPOSITORY" \
                      --image-ids "imageTag=$IMAGE_TAG" \
                      --query 'images[0].imageId.imageDigest' \
                      --output text)
                  image_exists=false
                  if [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      image_exists=true
                  elif [[ "$BUILD_IMAGE" != "true" ]]; then
                      echo "ECR does not contain rollback image $IMAGE_TAG." >&2
                      exit 1
                  fi

                  echo "exists=$image_exists" >> "$GITHUB_OUTPUT"

            - name: Log in to Amazon ECR
              if: steps.release.outputs.build_image == 'true' && steps.release_image.outputs.exists != 'true'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

            - name: Set up Docker Buildx
              if: steps.release.outputs.build_image == 'true' && steps.release_image.outputs.exists != 'true'
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build and push runtime image
              if: steps.release.outputs.build_image == 'true' && steps.release_image.outputs.exists != 'true'
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: ./Dockerfile
                  target: runtime
                  platforms: linux/amd64
                  push: true
                  provenance: false
                  build-args: |
                      APP_BUILD_SHA=${{ github.sha }}
                  tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.image_tag }}
                  cache-from: type=gha,scope=better-budget-runtime
                  cache-to: type=gha,mode=max,scope=better-budget-runtime

            - name: Find the production instance
              id: instance
              run: |
                  instance_ids=$(aws ec2 describe-instances \
                      --filters \
                          Name=tag:Application,Values=better-budget \
                          Name=tag:Environment,Values=production \
                          Name=instance-state-name,Values=running \
                      --query 'Reservations[].Instances[].InstanceId' \
                      --output text)
                  matches=()
                  if [[ -n "$instance_ids" ]]; then
                      read -r -a matches <<< "$instance_ids"
                  fi

                  if [[ "${#matches[@]}" -ne 1 ]]; then
                      echo "Expected exactly one running production instance; found ${#matches[@]}." >&2
                      exit 1
                  fi

                  ping_status=$(aws ssm describe-instance-information \
                      --filters "Key=InstanceIds,Values=${matches[0]}" \
                      --query 'InstanceInformationList[0].PingStatus' \
                      --output text)
                  if [[ "$ping_status" != "Online" ]]; then
                      echo "Production instance ${matches[0]} is not online in Systems Manager." >&2
                      exit 1
                  fi

                  echo "instance_id=${matches[0]}" >> "$GITHUB_OUTPUT"

            - name: Deploy through Systems Manager
              env:
                  IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
                  INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
              run: |
                  command_id=$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name AWS-RunShellScript \
                      --timeout-seconds 900 \
                      --parameters "commands=[\"sudo /usr/local/sbin/better-budget-deploy $IMAGE_TAG\"],executionTimeout=[\"2400\"]" \
                      --comment "Deploy Better Budget $IMAGE_TAG" \
                      --query 'Command.CommandId' \
                      --output text)

                  status=Pending
                  for _ in {1..480}; do
                      status=$(aws ssm get-command-invocation \
                          --command-id "$command_id" \
                          --instance-id "$INSTANCE_ID" \
                          --query Status \
                          --output text 2>/dev/null || true)

                      case "$status" in
                          Pending|InProgress|Delayed|'')
                              sleep 5
                              ;;
                          *)
                              break
                              ;;
                      esac
                  done

                  standard_output=$(aws ssm get-command-invocation \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query StandardOutputContent \
                      --output text || true)
                  standard_error=$(aws ssm get-command-invocation \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query StandardErrorContent \
                      --output text || true)

                  echo "Systems Manager command status: $status"
                  if [[ -n "$standard_output" && "$standard_output" != "None" ]]; then
                      echo "Systems Manager standard output:"
                      printf '%s\n' "$standard_output"
                  fi
                  if [[ -n "$standard_error" && "$standard_error" != "None" ]]; then
                      echo "Systems Manager diagnostics from standard error:" >&2
                      printf '%s\n' "$standard_error" >&2
                  fi

                  if [[ "$status" != "Success" ]]; then
                      echo "The EC2 deployment did not succeed." >&2
                      exit 1
                  fi

            - name: Verify production health
              run: |
                  verify_endpoint() {
                      curl --fail --silent --show-error \
                          --connect-timeout 5 \
                          --max-time 15 \
                          --retry 12 \
                          --retry-all-errors \
                          --retry-delay 5 \
                          --retry-max-time 90 \
                          "$1" > /dev/null
                  }

                  verify_endpoint "$PRODUCTION_URL/api/live"
                  verify_endpoint "$PRODUCTION_URL/api/ready"
