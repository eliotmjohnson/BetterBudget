name: Deploy production to Amazon EC2

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            image_tag:
                description: Existing 40-character ECR image tag to roll back to
                required: false
                type: string

permissions:
    contents: read
    id-token: write

concurrency:
    group: better-budget-production
    cancel-in-progress: false

env:
    AWS_REGION: us-east-2
    ECR_REPOSITORY: better-budget/app
    PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-24.04
        timeout-minutes: 45

        steps:
            - name: Select image tag
              id: release
              env:
                  REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  if [[ -n "$REQUESTED_IMAGE_TAG" ]]; then
                      image_tag="$REQUESTED_IMAGE_TAG"
                      build_image=false
                  else
                      image_tag="$GITHUB_SHA"
                      build_image=true
                  fi

                  if [[ ! "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "The image tag must be a full lowercase Git commit SHA." >&2
                      exit 1
                  fi

                  echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
                  echo "build_image=$build_image" >> "$GITHUB_OUTPUT"

            - name: Validate production configuration
              run: |
                  if [[ ! "$PRODUCTION_URL" =~ ^https://[^/]+$ ]]; then
                      echo "Set the PRODUCTION_URL repository variable to the CloudFront HTTPS origin." >&2
                      exit 1
                  fi

            - name: Check out repository
              if: steps.release.outputs.build_image == 'true'
              uses: actions/checkout@v4

            - name: Set up Node.js
              if: steps.release.outputs.build_image == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              if: steps.release.outputs.build_image == 'true'
              run: npm ci

            - name: Verify source
              if: steps.release.outputs.build_image == 'true'
              run: |
                  npm run format:check
                  npm run typecheck
                  npm run lint

            - name: Configure temporary AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                  role-to-assume: arn:aws:iam::563692880710:role/better-budget-github-deploy
                  role-session-name: better-budget-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Log in to Amazon ECR
              if: steps.release.outputs.build_image == 'true'
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set up Docker Buildx
              if: steps.release.outputs.build_image == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Build and push runtime image
              if: steps.release.outputs.build_image == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: runtime
                  platforms: linux/amd64
                  push: true
                  provenance: false
                  build-args: |
                      APP_BUILD_SHA=${{ github.sha }}
                  tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.image_tag }}
                  cache-from: type=gha,scope=better-budget-runtime
                  cache-to: type=gha,mode=max,scope=better-budget-runtime

            - name: Find the production instance
              id: instance
              run: |
                  instance_ids=$(aws ec2 describe-instances \
                      --filters \
                          Name=tag:Application,Values=better-budget \
                          Name=tag:Environment,Values=production \
                          Name=instance-state-name,Values=running \
                      --query 'Reservations[].Instances[].InstanceId' \
                      --output text)
                  matches=()
                  if [[ -n "$instance_ids" ]]; then
                      read -r -a matches <<< "$instance_ids"
                  fi

                  if [[ "${#matches[@]}" -ne 1 ]]; then
                      echo "Expected exactly one running production instance; found ${#matches[@]}." >&2
                      exit 1
                  fi

                  ping_status=$(aws ssm describe-instance-information \
                      --filters "Key=InstanceIds,Values=${matches[0]}" \
                      --query 'InstanceInformationList[0].PingStatus' \
                      --output text)
                  if [[ "$ping_status" != "Online" ]]; then
                      echo "Production instance ${matches[0]} is not online in Systems Manager." >&2
                      exit 1
                  fi

                  echo "instance_id=${matches[0]}" >> "$GITHUB_OUTPUT"

            - name: Deploy through Systems Manager
              env:
                  IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
                  INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
              run: |
                  command_id=$(aws ssm send-command \
                      --instance-ids "$INSTANCE_ID" \
                      --document-name AWS-RunShellScript \
                      --timeout-seconds 900 \
                      --parameters "commands=sudo /usr/local/sbin/better-budget-deploy $IMAGE_TAG" \
                      --comment "Deploy Better Budget $IMAGE_TAG" \
                      --query 'Command.CommandId' \
                      --output text)

                  status=Pending
                  for _ in {1..180}; do
                      status=$(aws ssm get-command-invocation \
                          --command-id "$command_id" \
                          --instance-id "$INSTANCE_ID" \
                          --query Status \
                          --output text 2>/dev/null || true)

                      case "$status" in
                          Pending|InProgress|Delayed|'')
                              sleep 5
                              ;;
                          *)
                              break
                              ;;
                      esac
                  done

                  echo "Systems Manager command status: $status"
                  aws ssm get-command-invocation \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query StandardOutputContent \
                      --output text || true
                  aws ssm get-command-invocation \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query StandardErrorContent \
                      --output text >&2 || true

                  if [[ "$status" != "Success" ]]; then
                      echo "The EC2 deployment did not succeed." >&2
                      exit 1
                  fi

            - name: Verify production health
              run: |
                  curl --fail --silent --show-error \
                      --retry 12 \
                      --retry-all-errors \
                      --retry-delay 5 \
                      "$PRODUCTION_URL/api/live" > /dev/null
                  curl --fail --silent --show-error \
                      --retry 12 \
                      --retry-all-errors \
                      --retry-delay 5 \
                      "$PRODUCTION_URL/api/ready" > /dev/null
